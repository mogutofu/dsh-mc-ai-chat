name: build-bukkit
on:
  push:
    paths:
      - 'platforms/bukkit/**'
      - 'common/**'
      - '.github/workflows/build-bukkit.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build plugin
        working-directory: platforms/bukkit
        run: gradle build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mcai-bukkit
          path: platforms/bukkit/build/libs/*.jar
          if-no-files-found: error
