name: build-bukkit
on:
  push:
    paths:
      - 'platforms/bukkit/**'
      - 'common/**'
      - 'tests/**'
      - '.github/workflows/build-bukkit.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      # 纯逻辑自测（不依赖 Bukkit / Minecraft）：mcai:bridge 帧编解码、token、上传辅助
      - name: Bridge protocol self-test
        run: |
          mkdir -p /tmp/bridge-test
          javac -encoding UTF-8 --release 8 -d /tmp/bridge-test \
            common/src/bridge/java/com/mogutofu/mcai/bridge/*.java \
            tests/BridgeSelfTest.java
          java -cp /tmp/bridge-test BridgeSelfTest | tee /tmp/bridge-test/out.txt
          grep -q '全部通过' /tmp/bridge-test/out.txt
      # 天气投票纯逻辑自测（1.3.0 起有，保持回归）
      - name: Weather vote self-test
        run: |
          mkdir -p /tmp/weather-test
          javac -encoding UTF-8 -d /tmp/weather-test \
            common/src/main/java/com/mogutofu/mcai/core/*.java \
            tests/WeatherVoteSelfTest.java
          java -cp /tmp/weather-test WeatherVoteSelfTest
      - name: Build plugin
        working-directory: platforms/bukkit
        run: gradle build --no-daemon --console=plain
      - name: Inspect plugin jar
        run: |
          JAR=platforms/bukkit/build/libs/mc-ai-bukkit-v1_4_0.jar
          ls -l "$JAR"
          sha256sum "$JAR"
          unzip -p "$JAR" plugin.yml | head -10
          unzip -l "$JAR" | grep -E 'com/mogutofu/mcai/(bridge|bukkit)/' | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: mcai-bukkit
          path: platforms/bukkit/build/libs/*.jar
          if-no-files-found: error
