name: build-forge-1.20.1
on:
  push:
    paths:
      - 'src/**'
      - 'client/**'
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-forge-1.20.1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build server mod
        run: ./gradlew build --no-daemon --console=plain
      - name: Build client mod
        working-directory: client
        run: ../gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mcai-forge-1.20.1
          path: |
            build/libs/*.jar
            client/build/libs/*.jar
          if-no-files-found: error
