name: fetch-paper
on:
  push:
    paths:
      - '.github/workflows/fetch-paper.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Paper downloads API
        run: |
          set -x
          echo '--- fill v3 ---'
          curl -sSL -m 60 -o fill.json -w 'HTTP %{http_code}\n' https://fill.papermc.io/v3/projects/paper/versions/1.20.1/builds/latest || true
          head -c 3000 fill.json || true
          echo
          echo '--- api v2 ---'
          curl -sSL -m 60 -o v2.json -w 'HTTP %{http_code}\n' https://api.papermc.io/v2/projects/paper/versions/1.20.1/builds || true
          head -c 2000 v2.json || true
      - name: Download Paper 1.20.1
        run: |
          URL=$(python3 - <<'PY'
          import json
          try:
              d=json.load(open('fill.json'))
              print(d['downloads']['server:default']['url'])
          except Exception as e:
              print('')
          PY
          )
          echo "URL=$URL"
          if [ -z "$URL" ]; then
            BUILD=$(python3 -c "import json;d=json.load(open('v2.json'));print(d['builds'][-1]['build'])" 2>/dev/null || true)
            echo "BUILD=$BUILD"
            URL="https://api.papermc.io/v2/projects/paper/versions/1.20.1/builds/${BUILD}/downloads/paper-1.20.1-${BUILD}.jar"
          fi
          echo "FINAL=$URL"
          curl -sSL -m 300 -o paper-1.20.1.jar "$URL"
          ls -l paper-1.20.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: paper-1.20.1
          path: paper-1.20.1.jar
          if-no-files-found: error
