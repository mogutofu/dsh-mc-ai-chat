plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'mc-ai-client-neoforge-1_21_1'
}

// 1.21.1 用户端是 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 客户端/插件共用的 mcai:bridge 协议层（Java 8 语法、零依赖）
sourceSets.main.java.srcDirs += rootProject.file('../../../common/src/bridge/java')

tasks.named('jar', Jar) {
    // 产物名必须和 docs/PORTING-1.3.0.md 完全一致
    archiveFileName = "mc-ai-client-neoforge-1_21_1-v${mod_version.replace('.', '_')}.jar"
    manifest {
        attributes(
                'Implementation-Title'  : 'mc-ai-client-neoforge-1.21.1',
                'Implementation-Version': project.version
        )
    }
}
