// mcai —— NeoForge 26.x 双端工程（server = mcai，client = mcai_client）。
//
// 一次构建产出两个 jar：
//   server/build/libs/mc-ai-neoforge-<mc>-v1_3_0.jar
//   client/build/libs/mc-ai-client-neoforge-<mc>-v1_3_0.jar
// 根工程把两个 jar 汇总到 build/libs，CI 只上传这一个目录。

tasks.register('build') {
    group = 'build'
    description = '构建 mcai（服务端）与 mcai_client（客户端）两个 jar，并汇总到根 build/libs'
    dependsOn ':server:build', ':client:build'
    doLast {
        copy {
            from project(':server').layout.buildDirectory.dir('libs')
            from project(':client').layout.buildDirectory.dir('libs')
            into layout.buildDirectory.dir('libs')
        }
        def out = layout.buildDirectory.dir('libs').get().asFile
        out.listFiles()?.sort()?.each { println "mcai: ${it.name} (${it.length()} bytes)" }
    }
}

// CI 里的 API 自查用：打印两个子工程的编译 classpath，方便直接 javap 查 MC 方法签名
tasks.register('printCompileCp') {
    group = 'help'
    description = '打印 server / client 的 compileClasspath（供 ci/dump-api.sh 用）'
    doLast {
        println 'CP_SERVER=' + project(':server').sourceSets.main.compileClasspath.asPath
        println 'CP_CLIENT=' + project(':client').sourceSets.main.compileClasspath.asPath
    }
}
