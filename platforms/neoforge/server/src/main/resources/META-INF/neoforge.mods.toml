[[mods]]
modId="mcai"
version="1.4.0"
displayName="Minecraft AI Chat"
authors="mogutofu"
# 客户端没装这个 mod 也能连服，不会弹红字（纯服务端功能）
displayTest="IGNORE_ALL_VERSION"
description='''
Chat with the AI (Xiaotong) in game: /ai <text>, plus /ai message|screenshot|file
(screenshot/file need the optional mcai-client mod); players can also change the
weather with /weather and vote with /vote. Requests are posted to the local DSH
service at 127.0.0.1:8765 (dsh-mc-server-ops is required on the server side).
'''

[[dependencies.mcai]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.mcai]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"
