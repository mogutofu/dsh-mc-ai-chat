# NeoForge 1.21.1 服务端工程（mcai）
# ModDevGradle 需要下载 NeoForge userdev 并反编译，堆别太小
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

## 环境属性
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.267
neo_version_range=[21.1,)
loader_version_range=[1,)

## Mod 属性
mod_id=mcai
mod_name=Minecraft AI Chat
mod_license=MIT
mod_version=1.3.0
mod_group_id=com.mogutofu.mcai
mod_authors=mogutofu
mod_description=Chat with the AI (Xiaotong) in game: /ai <text>, plus /ai message|screenshot|file (screenshot/file need the optional mcai-client mod); players can also change the weather with /weather and vote with /vote. Requests are posted to the local DSH service at 127.0.0.1:8765 (dsh-mc-server-ops is required on the server side).
