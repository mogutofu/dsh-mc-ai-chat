# Gradle 参数：CI runner 内存够用，本地也别吃太多
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true

## Fabric 属性（26.x 是 non-remapping，官方 Mojang 名，不需要 mappings）
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

## fabric-api 默认版本，只用于本地构建；CI 会查 maven-metadata.xml
## 挑对应 +26.x 的最新稳定版，再用 -Pfabric_api=... 覆盖。
## 26.1 故意留空：本机/离线不知道确切版本，必须由 CI 解析后传入（不猜）。
fabric_api_version_26_1=
fabric_api_version_26_2=0.158.0+26.2
fabric_api_version_26_3=0.166.2+26.3
