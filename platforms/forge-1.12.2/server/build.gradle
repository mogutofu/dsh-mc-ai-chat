// mcai —— Forge 1.12.2 服务端模组
// 工具链固定：ForgeGradle 2.3-SNAPSHOT + Gradle 4.10.3 + JDK 8 + mappings snapshot_20171003
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        // FG 2.3-SNAPSHOT 的部分传递依赖当年只发在 jcenter（已关停），补一个只读镜像兜底
        maven { url = 'https://maven.aliyun.com/repository/jcenter' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.3.0'
group = 'com.mogutofu.mcai'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    // 编译基座用 14.23.5.2847：Forge 官方 maven 上 14.23.5.2854/2855/2859/2860 都没有
    // -userdev 制品（CI 探针实测 404），ForgeGradle 2.3 起不来；2847 是 1.12.2 有 userdev
    // 的最后一个常用构建。编译出的 jar 的 mcmod.info / @Mod 仍是 1.12.2，2860 服务端可直接用。
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'snapshot_20171003'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

// 公共核心（Java 8、零依赖）直接编进 jar：
// AiSettings / AiClient / Cooldown / WeatherVoteService / WeatherSettings / Json / Attachment / Actor
sourceSets.main.java.srcDirs += file('../../../common/src/main/java')

// 默认代码页不是 UTF-8 时中文源码会乱码，统一指定
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
processResources {
    filteringCharset = 'UTF-8'
}

jar {
    // Gradle 4.10 用 archiveName；名字必须是最终产物名
    archiveName = 'mc-ai-forge-1_12_2-v1_3_0.jar'
    manifest {
        attributes(
                'Implementation-Title': 'mc-ai-forge-1_12_2',
                'Implementation-Version': project.version
        )
    }
}
