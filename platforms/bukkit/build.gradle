plugins {
    id 'java'
}

group = 'com.mogutofu.mcai'
version = '1.3.0'

// 本机 DSH 受限令牌下 Java 无法在仓库目录里新建 build/；本地构建时把产物目录指到
// D:\server\temp 下（CI 不设置该变量，仍用默认 build/）。
def externalBuildDir = System.getenv('MCAI_BUILD_DIR')
if (externalBuildDir) {
    layout.buildDirectory = file(externalBuildDir)
}

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main.java.srcDirs += rootProject.file('../../common/src/main/java')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}

tasks.named('jar') {
    archiveFileName = "mc-ai-bukkit-v${project.version.replace('.', '_')}.jar"
    manifest {
        attributes(
                'Implementation-Title': 'mc-ai-bukkit',
                'Implementation-Version': project.version
        )
    }
}
