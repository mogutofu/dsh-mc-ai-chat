# Gradle 构建参数：这台机器只有 8G 内存、MC 服还开着，先用 2G 堆；构建 OOM 再调
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
org.gradle.daemon=false

## 环境属性
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.23
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod 属性（客户端模组，独立 Gradle 工程）
mod_id=mcai_client
mod_name=Minecraft AI Chat Client
mod_license=MIT
mod_version=1.1.0
mod_group_id=com.mogutofu.mcai.client
mod_authors=mogutofu
mod_description=Optional client companion for Minecraft AI Chat (mcai): lets /ai screenshot and /ai file send the current screen or a local file to the AI. Requires the mcai server mod on the server side.
