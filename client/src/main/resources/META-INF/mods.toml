modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# 纯客户端选装模组：服务器不装它也不该弹红字
displayTest="IGNORE_SERVER_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# 需要服务端装 mcai >= 1.1.0。side="SERVER" 表示只在服务端侧校验：
# 客户端本地没有 mcai 这个 jar 也能启动（否则每个玩家都得装服务端模组），
# 服务器没装 mcai 时不会收到附件请求，功能自然不可用。
[[dependencies.${mod_id}]]
modId="mcai"
mandatory=true
versionRange="[1.1.0,)"
ordering="NONE"
side="SERVER"
